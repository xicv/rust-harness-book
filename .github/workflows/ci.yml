name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify scaffold and book sources
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      - name: Install mdBook 0.5.4
        env:
          MDBOOK_VERSION: "0.5.4"
          MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl --fail --location --silent --show-error \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" --directory "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mdbook/mdbook" --version

      - name: Install Typst 0.15.1
        uses: typst-community/setup-typst@40d32bb6ccb235bd7f5164cb47cfd40a5ea3a314 # v4 built action
        with:
          typst-version: "0.15.1"

      - name: Install CJK fonts for the PDF build
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk poppler-utils

      - name: Validate scaffold metadata and links
        run: make scaffold-check

      - name: Check Rust formatting without rewriting files
        run: make fmt-check

      - name: Check Rust workspace
        run: make check

      - name: Run Rust tests
        run: make test

      - name: Run Clippy
        run: make lint

      - name: Test book Rust examples
        run: make book-test

      - name: Build and verify reader editions
        run: make reader-delivery

      - name: Render canonical Markdown and build full PDF
        run: make pdf

      - name: Verify compiled PDF carries the book licence
        run: python3 scripts/check_reader_delivery.py --pdf-artifacts
